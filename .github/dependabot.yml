version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    # astro check refuses to run on TypeScript 7, and @astrojs/check's peer
    # range stops at 6, so a major bump fails npm ci in the deploy. Lift this
    # when the site moves off astro check.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
      other-dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - 'astro'
          - '@astrojs/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    # The deploy action is pinned to the tip of its v1 branch. Its only
    # release tag is an older commit, and Dependabot offers that as an update.
    ignore:
      - dependency-name: 'Azure/static-web-apps-deploy'
    groups:
      actions:
        patterns:
          - '*'
